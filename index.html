<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1015" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Banana Gym" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <title>Banana Gym</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Last-resort screen: if the app never draws (script failed to load or crashed at start),
      // show the error and a repair button instead of an empty page. Data in IndexedDB is never touched.
      (function () {
        var errs = [];
        addEventListener('error', function (e) { errs.push(e.message || (e.target && (e.target.src || e.target.href)) || 'błąd'); }, true);
        addEventListener('unhandledrejection', function (e) { errs.push(String((e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () {
          var r = document.getElementById('root');
          if (!r || r.children.length) return;
          r.innerHTML = '<div style="padding:48px 20px;color:#e8e6e3;font:16px/1.45 system-ui,sans-serif">' +
            '<h1 style="font-size:1.3rem">Aplikacja się nie wczytała</h1>' +
            '<p>Twoje treningi są bezpieczne w telefonie. Zrób zrzut tego ekranu dla autora, potem stuknij „Napraw”.</p>' +
            '<pre style="white-space:pre-wrap;font-size:12px;color:#ff7a45">' + (errs.join(' | ') || 'brak komunikatu').replace(/</g, '&lt;') + '</pre>' +
            '<button id="fix" style="min-height:48px;padding:0 20px;font:inherit;font-weight:700;border-radius:12px;border:0;background:#ffd23f">Napraw</button></div>';
          document.getElementById('fix').onclick = function () {
            var jobs = [];
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (x) { return x.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            try { sessionStorage.setItem('gym.noResume', '1'); } catch (e) {}
            Promise.all(jobs).finally(function () { location.replace(location.pathname + '#/'); location.reload(); });
          };
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
